# August historical demo: all content and APIs require authentication.
location = /listening-demo { return 302 /listening-private/; }
location ^~ /listening-demo/ { return 302 /listening-private/; }
location = /listening-private { return 302 /listening-private/; }
location ^~ /listening-private/ {
    auth_basic "Ninebot Internal Demo";
    auth_basic_user_file /etc/nginx/listening-demo.htpasswd;
    client_max_body_size 12k;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types application/json application/javascript text/css text/csv;
    proxy_pass http://127.0.0.1:8881/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
}
