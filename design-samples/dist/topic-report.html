<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',shield:'<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/>',chart:'<path d="M4 3v17h17M8 15v-4m5 4V6m5 9v-6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',droplet:'<path d="M12 3C10 6 5 11 5 15a7 7 0 0 0 14 0c0-4-5-9-7-12Z"/><path d="M8 15a4 4 0 0 0 4 4"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',message:'<path d="M21 11a8 8 0 0 1-8 8H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/><path d="M7 8h10M7 12h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',sparkles:'<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6ZM20 2v4m-2-2h4"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.grid}</svg>`;
function hydrate(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}

const R=JSON.parse($('#report-data').textContent), N=R.narrative;
const all=R.records, related=all.filter(r=>r.label.relevance==='related'), uncertain=all.filter(r=>r.label.relevance==='uncertain');
const sourceNames=Object.fromEntries(R.stats.sources.map(s=>[s.source,s.label]));
const concernNames={safety:'涉及安全',focus:'需重点关注',angry:'情绪激动',normal:'一般讨论'};
let period='month',category='all',source='all',topic='all',showUncertain=false,page=1,view='overview',lastFocus;
const marks=new Set();
const number=v=>Number(v||0).toLocaleString('zh-CN');
const negative=r=>['愤怒','失望'].includes(r.label.sentiment);
function range(){const end=R.filters.end;let start=R.filters.start;if(period!=='month'){const d=new Date(end+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(period==='today'?2:6));start=[start,d.toISOString().slice(0,10)].sort().at(-1)}return [start,end]}
function activeRows(){const [start,end]=range();return related.filter(r=>r.time.slice(0,10)>=start&&r.time.slice(0,10)<=end)}
function periodButtons(){return `<div class="period" role="group" aria-label="时间窗口">${[['today','近3天'],['week','近一周'],['month','全周期']].map(([k,n])=>`<button data-period="${k}" class="${period===k?'active':''}" aria-pressed="${period===k}">${n}</button>`).join('')}</div>`}
function metric(name,value,note,ico,unit='条'){return `<article class="card metric"><div class="metric-label">${esc(name)}</div><div class="metric-value">${number(value)}<small>${unit}</small></div><div class="metric-note">${esc(note)}</div><span class="metric-icon">${icon(ico)}</span></article>`}
function refs(ids){return ids.map(id=>`<button class="evidence-ref" data-event="${esc(id)}">原文 ${esc(id.slice(0,6))} ↗</button>`).join('')}
function chart(){const [lo,hi]=range(),days=R.stats.days.filter(d=>d.date>=lo&&d.date<=hi),max=Math.max(1,...days.map(d=>d.total)),step=Math.max(1,Math.ceil(days.length/7)),x=i=>35+i*500/Math.max(1,days.length-1),y=v=>140-115*v/max,path=k=>days.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(d[k]).toFixed(1)}`).join(' ');return `<svg class="chart" viewBox="0 0 565 178" role="img" aria-label="讨论量与负面情绪量趋势"><defs><linearGradient id="trend-fill" x2="0" y2="1"><stop stop-color="#9dbaff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${[0,.5,1].map(v=>`<path d="M35 ${y(max*v)}H535" stroke="#b6c7dd" stroke-opacity=".3"/><text x="2" y="${y(max*v)+3}">${Math.round(max*v)}</text>`).join('')}<path d="${path('total')}L535 140L35 140Z" fill="url(#trend-fill)"/><path d="${path('total')}" fill="none" stroke="#78a2f2" stroke-width="2.5"/><path d="${path('negative')}" fill="none" stroke="#e997a6" stroke-width="2"/>${days.filter((d,i)=>i%step===0||i===days.length-1).map(d=>`<text x="${x(days.indexOf(d))}" y="166" text-anchor="middle">${d.date.slice(5)}</text>`).join('')}</svg>`}
function listRows(rows){return rows.map(r=>`<button class="event-row" data-event="${esc(r.id)}"><span class="event-dot ${r.label.concern==='safety'?'high':'medium'}"></span><span class="event-main"><b>${esc(r.label.title)}</b><small>${esc(r.group_name||r.channel||sourceNames[r.source])} · ${esc(r.time.slice(5,16).replace('T',' '))} · ${esc(r.label.topic)}</small></span><span class="badge ${r.label.concern==='safety'?'high':'medium'}">${esc(concernNames[r.label.concern])}</span>${icon('chevron')}</button>`).join('')||'<div class="empty">当前范围暂无匹配记录</div>'}
function scope(){return `<article class="card scope-panel"><h2>数据口径与生成依据</h2><p class="scope-note">统计窗口：${esc(R.filters.start)} — ${esc(R.filters.end)}。检索命中 ${number(R.retrieved)} 条，专项逐条分析 ${number(R.analyzed)} 条；纳入 ${number(R.stats.total)} 条，关联待核实 ${number(R.stats.uncertain)} 条，不相关 ${number(R.stats.excluded)} 条。统计单位为消息，未做跨渠道事件去重，不能据此推断故障率。</p><p class="scope-note">负面情绪 = 愤怒 + 失望；分母为本期纳入的相关消息，不含待判相关和排除记录。安全线索不等于已确认事故。</p><p class="scope-note">模型：${esc(R.model)} · 专项逐条精筛 + 报告综合分析（结合全量统计与 ${R.evidence_ids?.length||0} 条代表原声）。图表和比例由程序计算。生成于 ${esc(R.created_at.replace('T',' '))}。</p><details><summary>查看本次需求与检索方案</summary><p class="scope-note">${esc(R.request)}</p><p class="scope-note">对象：${R.plan.entity_terms.map(esc).join(' / ')}<br>问题检索词：${R.plan.keywords.map(esc).join(' / ')}<br>主题分类：${R.plan.topics.map(esc).join(' / ')}</p><p class="scope-note">关键词检索可能遗漏隐含表述，群名称仅支持车型背景；不能据相似表述认定同一事故或确认共性缺陷。</p></details>${N.limitations.map(x=>`<p class="scope-note">· ${esc(x)}</p>`).join('')}</article>`}
function downloads(){return `<div class="download-bar"><button class="button primary" data-download="html">下载完整报告 HTML</button><button class="button" data-download="csv">导出当前筛选原始明细</button><button class="button" data-download="json">导出报告数据 JSON</button><button class="button" data-print>打印当前视图 / PDF</button></div>`}
function overview(){const rr=activeRows(),neg=rr.filter(negative).length,days=R.stats.days.filter(d=>d.date>=range()[0]),peak=days.reduce((a,b)=>b.total>a.total?b:a,{total:0,date:'—'}),channels={};rr.forEach(r=>channels[r.channel||sourceNames[r.source]]=(channels[r.channel||sourceNames[r.source]]||0)+1);const top=rr.filter(r=>r.label.concern!=='normal').sort((a,b)=>['safety','focus','angry'].indexOf(a.label.concern)-['safety','focus','angry'].indexOf(b.label.concern)).slice(0,8);return `<div class="notice-band">${esc(R.notice)} · 本页为系统依据真实数据自动生成</div><section class="hero"><div class="hero-copy"><div class="eyebrow">ONE ISSUE · EVERY VOICE COUNTS</div><h1>${esc(R.title)}<br><span>专项话题整合。</span></h1><p>${esc(N.summary)}</p><div class="hero-bottom"><a class="button primary" href="#review">查看重点内容 ${icon('arrow')}</a><span class="hero-time">${esc(R.filters.start)} — ${esc(R.filters.end)}</span></div></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><div class="orbit"></div><div class="floating-tag">✧ &nbsp; TRACKING ONE ISSUE</div><div class="floating-card"><small>全周期相关反馈</small><b>${number(R.stats.total)}</b><span>条</span></div><div class="art-caption">A LITTLE CLARITY. EVERY DAY.</div></div></section><div class="section-heading"><h2>热度趋势 <small>${range().map(esc).join(' — ')}</small></h2>${periodButtons()}</div><section class="metrics">${R.stats.sources.map((s,i)=>metric(({wecom:'企微社群',wechat_export:'微信导出',voc:'公域 VOC',suggestions:'意见建议'})[s.source],rr.filter(r=>r.source===s.source).length,'同一时间窗口 · 相关消息',['message','message','chart','check'][i])).join('')}</section><section class="middle-grid"><article class="card"><div class="card-head"><h2>整体热度趋势</h2><div class="legend"><span><i></i>相关讨论</span><span><i></i>负面情绪</span></div></div><div class="trend-stat">讨论 <b>${number(rr.length)}</b> 条 · 负面 <b>${number(neg)}</b> 条（${rr.length?(100*neg/rr.length).toFixed(1)+'%':'无数据'}）· 峰值 ${peak.total}（${peak.date.slice(5)}）</div>${chart()}<div class="chart-foot"><span>单位：消息条数</span><span>负面 = 愤怒 + 失望</span></div></article><article class="card"><div class="card-head"><h2>真实渠道构成</h2><small>本窗口纳入 ${rr.length} 条</small></div><div class="channels">${Object.entries(channels).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`<div class="channel-row"><div class="channel-logo">${esc(name[0])}</div><span>${esc(name)}</span><div class="bar"><i style="width:${100*n/Math.max(1,rr.length)}%"></i></div><small>${n}条</small></div>`).join('')||'<p class="empty">暂无相关渠道记录</p>'}</div><div class="channel-foot">各来源按同一窗口展示；没有检出相关记录的来源明确显示为零。</div></article></section><section class="bottom-grid"><article class="card"><div class="card-head"><h2>需要关注的内容</h2><a class="text-button" href="#review">查看全部 ↗</a></div>${listRows(top)}</article><article class="card quote-card"><div class="insight-label">${icon('sparkles')} INSIGHT OF THE PERIOD</div><h3 class="report-headline">${esc(N.headline)}</h3><p>${esc(N.findings[0]?.text||N.summary)}</p>${refs(N.findings[0]?.evidence_ids||[])}<a class="text-button" href="#insights">探索问题洞察 ↗</a><div class="quote-orb" aria-hidden="true"></div></article></section>${scope()}${downloads()}`}
function selectedRows(){const q=$('#search').value.trim().toLowerCase();return (showUncertain?uncertain:related).filter(r=>(category==='all'||r.label.concern===category)&&(source==='all'||source===r.source)&&(topic==='all'||topic===r.label.topic)&&(!q||[r.raw_text,r.group_name,r.channel,r.label.title,r.label.topic].join(' ').toLowerCase().includes(q)))}
function review(){const rr=selectedRows(),pages=Math.max(1,Math.ceil(rr.length/40));page=Math.min(page,pages);return `<div class="page-title"><div><div class="eyebrow">EVIDENCE BEFORE CONCLUSIONS</div><h1>重点内容</h1><p>逐条还原原文、真实渠道和模型判断依据。</p></div><span class="demo-pill">${number(rr.length)} 条匹配</span></div><div class="review-summary">${['safety','focus','angry'].map((k,i)=>metric(concernNames[k],related.filter(r=>r.label.concern===k).length,'全周期全来源 · 模型标注待核验',['shield','clock','message'][i])).join('')}</div><article class="card review-card"><div class="card-head"><h2>内容队列</h2><small>完整原文可点开查阅</small></div><div class="evidence-controls"><label>分类 <select id="category">${['all',...Object.keys(concernNames)].map(k=>`<option value="${k}" ${category===k?'selected':''}>${k==='all'?'全部分类':concernNames[k]}</option>`).join('')}</select></label><label>来源 <select id="source">${[['all','全部来源'],...Object.entries(sourceNames)].map(([k,n])=>`<option value="${k}" ${source===k?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>话题 <select id="topic">${['all',...R.plan.topics].map(k=>`<option value="${esc(k)}" ${topic===k?'selected':''}>${esc(k==='all'?'全部话题':k)}</option>`).join('')}</select></label><label><input type="checkbox" id="uncertain" ${showUncertain?'checked':''}> 仅查看关联待核实（不计入统计）</label></div>${listRows(rr.slice((page-1)*40,page*40))}<div class="evidence-controls"><button class="button" data-page="${page-1}" ${page<=1?'disabled':''}>上一页</button><span>${page} / ${pages}</span><button class="button" data-page="${page+1}" ${page>=pages?'disabled':''}>下一页</button></div></article>${downloads()}`}
function insights(){return `<div class="page-title"><div><div class="eyebrow">SMALL SIGNALS. BIGGER PICTURE.</div><h1>问题洞察</h1><p>模型归纳 · 每项发现与建议均可回看依据</p></div><span class="demo-pill">全周期负面 ${R.stats.negative_rate===null?'无数据':R.stats.negative_rate+'%'}</span></div><div class="insight-grid">${R.stats.topics.map((t,i)=>`<article class="card topic-card"><div class="topic-top"><span>ISSUE / ${String(i+1).padStart(2,'0')}</span>${icon('message')}</div><h2>${esc(t.topic)}</h2><div class="topic-data"><div><b>${number(t.total)}</b><span>相关讨论</span></div><div><b>${(100*t.total/Math.max(1,R.stats.total)).toFixed(1)}%</b><span>相关消息占比</span></div></div><div class="topic-bottom"><button class="text-button" data-topic="${esc(t.topic)}">查看主题原声 ↗</button></div></article>`).join('')}</div><div class="section-heading"><h2>核心发现与证据链</h2><small>模型观察，尚未人工核验</small></div><div class="findings-grid">${N.findings.map((f,i)=>`<article class="card finding"><div class="eyebrow">FINDING / ${String(i+1).padStart(2,'0')}</div><h3>${esc(f.title)}</h3>${f.review_status==='needs_review'?'<span class="fact-pill warning-text">待人工补充</span>':''}<p>${esc(f.text)}</p>${refs(f.evidence_ids)}</article>`).join('')}</div><div class="section-heading"><h2>建议行动</h2><small>建议方案，不代表已执行</small></div><div class="findings-grid">${N.actions.map((f,i)=>`<article class="card finding"><div class="eyebrow">NEXT STEP / ${String(i+1).padStart(2,'0')}</div><h3>${esc(f.title)}</h3>${f.review_status==='needs_review'?'<span class="fact-pill warning-text">待人工补充</span>':''}<p>${esc(f.text)}</p>${refs(f.evidence_ids)}</article>`).join('')}</div><article class="card scope-panel"><h2>情绪分布</h2>${Object.entries(R.stats.emotions).map(([k,n])=>`<span class="fact-pill">${esc(k)} ${n} 条 · ${(100*n/Math.max(1,R.stats.total)).toFixed(1)}%</span>`).join('')}<p class="scope-note">情绪为本次专项模型标注。未将一般风险等级直接当作负面情绪。</p></article>${scope()}${downloads()}`}
function render(){view=['overview','review','insights'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';$('#breadcrumb').textContent={overview:'态势总览',review:'重点内容',insights:'问题洞察'}[view];document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===view);if(a.dataset.nav===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('#nav-count').textContent=related.filter(r=>r.label.concern!=='normal').length;$('#main').innerHTML=view==='review'?review():view==='insights'?insights():overview();hydrate()}
function openEvent(id){const r=all.find(r=>r.id===id);if(!r)return;lastFocus=document.activeElement;const meta=[['消息时间',r.time],['数据来源',r.source_name],['真实渠道',r.channel],['群名称',r.group_name],['原作者',r.author],['原消息ID',r.native_id||'源数据未提供'],['来源文件',r.source_file],['工作表 / 行号',r.source_row],['本系统消息ID',r.id]];$('#detail-content').innerHTML=`<div class="detail-eyebrow">ORIGINAL VOICE · ${esc(r.label.relevance==='related'?'相关原声':'关联待核实')}</div><h2 id="detail-title">${esc(r.label.title)}</h2><div class="detail-meta"><span>${esc(r.label.topic)}</span><span>${esc(r.label.sentiment)}</span><span>${esc(concernNames[r.label.concern])}</span></div><h3>完整用户原文</h3><blockquote>${esc(r.raw_text)}</blockquote>${r.raw_quote?`<h3>原始引用</h3><blockquote>${esc(r.raw_quote)}</blockquote>`:''}${r.label.quote_basis?`<p class="scope-note">${esc(r.label.quote_basis)}</p>`:''}<h3>关注理由 · 模型判断</h3><p>${esc(r.label.reason)}</p><h3>真实来源定位</h3><dl class="record-fields">${meta.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v||'未提供')}</dd>`).join('')}</dl><details><summary>完整来源字段</summary><pre class="record-fields">${esc(JSON.stringify(r.raw_json,null,2))}</pre></details><div class="detail-note">原文与模型判断分开展示。本报告未核实车型实物、检测结论及售后处理状态；担忧、咨询不能当作已发生事故。</div><div class="dialog-actions"><button class="button primary" data-mark="${esc(id)}">${marks.has(id)?'已标记 · 仅当前页面':'标记重点跟进 · 仅当前页面'}</button></div>`;if(!$('#detail').open)$('#detail').showModal()}
function liveDownload(format){if(!location.pathname.includes('/api/topic-reports/'))return false;const params=new URLSearchParams({format,view,period,topic:view==='review'?topic:'all',source:view==='review'?source:'all',category:view==='review'?category:'all',q:view==='review'?$('#search').value:'',uncertain:view==='review'&&showUncertain?'1':'0'});location.assign(new URL('export?'+params,location.href));return true}
function downloadFile(name,content,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function csvExport(){if(liveDownload('csv'))return;const rr=view==='review'?selectedRows():activeRows();const cols=[['id','消息ID'],['time','时间'],['source_name','来源'],['channel','真实渠道'],['group_name','群名称'],['raw_text','完整原文'],['raw_quote','完整引用'],['source_file','源文件'],['source_row','源行号']];const cell=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let data=[cols.map(x=>x[1]).concat(['关联判定','情绪','问题主题','关注理由']).map(cell).join(',')];rr.forEach(r=>data.push(cols.map(([k])=>r[k]).concat([r.label.relevance,r.label.sentiment,r.label.topic,r.label.reason]).map(cell).join(',')));downloadFile(R.title+'_筛选明细.csv','\ufeff'+data.join('\r\n'),'text/csv;charset=utf-8')}
function closeDialog(){$('#detail').close();if(lastFocus?.isConnected)lastFocus.focus()}
$('.close-dialog').onclick=closeDialog;
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))closeDialog()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.period){period=t.dataset.period;render()}if(t.dataset.event)openEvent(t.dataset.event);if(t.dataset.topic){topic=t.dataset.topic;$('#search').value='';category='all';source='all';showUncertain=false;page=1;location.hash='review';render()}if(t.dataset.page){page=Number(t.dataset.page);render()}if(t.dataset.mark){marks.add(t.dataset.mark);t.textContent='已标记 · 仅当前页面'}if(t.hasAttribute('data-print'))window.print();if(t.dataset.download==='csv')csvExport();if(t.dataset.download==='json'&&!liveDownload('json'))downloadFile(R.title+'.json',JSON.stringify(R,null,2),'application/json');if(t.dataset.download==='html'&&!liveDownload('html'))downloadFile(R.title+'.html','<!doctype html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8')});
document.addEventListener('change',e=>{if(e.target.id==='category')category=e.target.value;else if(e.target.id==='source')source=e.target.value;else if(e.target.id==='topic')topic=e.target.value;else if(e.target.id==='uncertain')showUncertain=e.target.checked;else return;page=1;render()});
$('#search').addEventListener('input',()=>{page=1;if(view!=='review')location.hash='review';else render()});
$('#glass-level').addEventListener('input',e=>document.documentElement.style.setProperty('--glass-alpha',e.target.value/100));
$('#notifications').onclick=()=>{location.hash='insights'};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});
document.title=R.title+' · 专项分析报告';document.querySelector('.brand small').textContent=R.title;hydrate();render();
</script></body></html>
